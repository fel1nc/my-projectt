<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кино и История (1908–2000)</title>
<style>
  :root {
    --bg: #1a1512;
    --panel: #2a221b;
    --text: #e8dcc8;
    --muted: #a69882;
    --accent-gold: #d4af37;
    --beige-title: #dfcba8;
    --film-border: #3a2f26;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif; 
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.03"/%3E%3C/svg%3E');
  }

  .slider-section {
    padding: 25px 40px 15px;
    flex-shrink: 0;
    border-bottom: 4px dashed var(--film-border);
    background: rgba(0,0,0,0.2);
    position: relative;
  }

  .year-display {
    text-align: center;
    font-size: 32px;
    color: var(--accent-gold);
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
  }

  .range-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 8px;
    background: var(--film-border);
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  .range-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent-gold);
    border: 3px solid var(--bg);
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
    cursor: grab;
    transition: transform 0.1s;
  }

  .range-slider::-webkit-slider-thumb:active {
    cursor: grabbing;
    transform: scale(1.2);
  }

  .range-slider::-moz-range-thumb {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent-gold);
    border: 3px solid var(--bg);
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
    cursor: grab;
  }

  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    font-family: sans-serif;
  }

  .main-container {
    display: flex;
    flex: 1;
    gap: 20px;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  .main-container::before, .main-container::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 15px;
    background: repeating-linear-gradient(
      to bottom,
      var(--film-border),
      var(--film-border) 10px,
      transparent 10px,
      transparent 20px
    );
    opacity: 0.5;
  }
  .main-container::before { left: 0; }
  .main-container::after { right: 0; }

  .column {
    flex: 1;
    background: var(--panel);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--film-border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    position: relative;
  }

  .column-header {
    padding: 15px 20px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: bold;
    border-bottom: 1px solid var(--film-border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--beige-title);
  }

  .column-header span { font-size: 18px; }

  .column-content {
    padding: 25px;
    overflow-y: auto;
    flex: 1;
    font-size: 18px;
    line-height: 1.8;
    color: var(--text);
  }
  
  .column-content p { margin-bottom: 20px; }

  .column-content::-webkit-scrollbar { width: 8px; }
  .column-content::-webkit-scrollbar-thumb { background: var(--film-border); border-radius: 4px; }

  .movie-block {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
    align-items: flex-start;
  }

  .movie-photo-container {
    flex: 0 0 40%;
    max-width: 300px;
    border: 2px solid var(--film-border);
    padding: 4px;
    background: rgba(0,0,0,0.4);
    box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 5px 15px rgba(0,0,0,0.5);
    border-radius: 4px;
  }

  .movie-photo {
    width: 100%;
    height: auto;
    display: block;
    filter: sepia(0.4) contrast(1.1) grayscale(0.2);
    border: 1px solid #111;
    transition: filter 0.4s ease;
  }

  .movie-photo:hover {
    filter: sepia(0) contrast(1.1) grayscale(0);
  }

  .cinema-text-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .cinema-text { 
    font-size: 18px;
    margin-bottom: 15px;
  }
  
  .analysis-box {
    background: rgba(0,0,0,0.2);
    padding: 15px;
    border-radius: 4px;
    font-size: 15px;
    color: var(--muted);
    border-left: 3px solid var(--accent-gold);
    font-style: italic;
    line-height: 1.5;
    margin-top: auto;
  }

  @media (max-width: 768px) {
    .movie-block { flex-direction: column; }
    .movie-photo-container { flex: none; width: 100%; max-width: 100%; }
    .main-container { flex-direction: column; padding: 10px; }
    .column-content { font-size: 16px; padding: 15px; }
    .slider-section { padding: 15px 20px 10px; }
    .year-display { font-size: 24px; }
  }
</style>
</head>
<body>

  <div class="slider-section">
    <div class="year-display" id="current-year-display">1908</div>
    <input type="range" id="year-slider" class="range-slider" min="0" max="0" value="0" step="1">
    <div class="slider-labels">
      <span id="label-start">1908</span>
      <span id="label-end">2000</span>
    </div>
  </div>

  <div class="main-container">
    <div class="column history">
      <div class="column-header">История <span>📜</span></div>
      <div class="column-content" id="history-content"></div>
    </div>

    <div class="column cinema">
      <div class="column-header">Кино <span>🎞️</span></div>
      <div class="column-content" id="cinema-content"></div>
    </div>
  </div>

<script>
  const moviesData = [
    { year: 1908, history: "Период реакции после революции 1905 года. В стране идет столыпинская аграрная реформа, но обстановка накалена: в Туруханске ссыльные поднимают бунт (арестован 141 человек), а в Петербургском университете 5000 студентов объявляют забастовку против репрессий нового министра просвещения. В воздухе висит предчувствие больших потрясений.", cinema: "«Понизовая вольница» («Стенька Разин»).", photo: "https://www.museikino.ru/upload/images/2016/10/kinodata/ponizovaja.jpg", analysis: "Начало положено. Кино пока воспринимается скорее как аттракцион, а не как искусство." },
    { year: 1909, history: "Продолжение столыпинских реформ. В феврале 1909 года происходит министерский кризис, после которого правительство берет курс на ужесточение политики в отношении иноверцев и старообрядцев (законопроекты о свободе совести проваливаются в Думе). В обществе нарастает усталость от реакции.", cinema: "«Тарас Бульба», «Вий». «Вий» стал первым российским фильмом ужасов.", analysis: "Кинематограф начинает осваивать жанры и экранизировать классику." },
    { year: 1910, history: "В январе в Париже проходит пленарное совещание ЦК РСДРП, где большевики и меньшевики пытаются договориться о совместной работе (примирение, которое скоро снова обернется расколом). В ноябре умирает Лев Толстой, и его похороны превращаются в масштабную антиправительственную демонстрацию. В университетах снова неспокойно: в Новороссийском университете происходит перестрелка между полицией и студентами.", cinema: "«Княжна Тараканова», «Идиот».", photo: "https://sun9-60.vkuserphoto.ru/c848536/v848536106/e954c/PorcNamayAs.jpg", analysis: "Продолжается бум экранизаций." },
    { year: 1911, history: "Трагедия в Киеве. 14 сентября в Киевском оперном театре анархист Дмитрий Богров смертельно ранит премьер-министра Петра Столыпина. Столыпин умирает через пять дней. Это событие становится концом эпохи реформ и началом нового витка реакции. В стране нарастает неурожай и голод (охвачено 20 млн крестьян).", cinema: "«Оборона Севастополя» (реж. Александр Ханжонков, Василий Гончаров). Первый в России полнометражный художественный фильм.", photo: "https://cdn.руни.рф/images/2/26/Oborona_sevastopolya_1911_09.jpg", analysis: "Обращение к историческим хроникам Крымской войны." },
    { year: 1912, history: "Ленский расстрел. В апреле на Ленских золотых приисках войска расстреливают мирное шествие рабочих (погибло около 250 человек). Это событие вызывает взрыв стачек и демонстраций по всей стране (1 мая бастует 500 тысяч рабочих). В стране начинается новый революционный подъем.", cinema: "«Месть кинематографического оператора» (реж. Владислав Старевич) — один из ранних примеров кукольной анимации. «1812 год» (реж. Василий Гончаров) — историческая драма.", analysis: "Эксперименты с формой (анимация) и обращение к патриотической теме." },
    { year: 1913, history: "300-летие дома Романовых. Страна отмечает юбилей царской династии с невероятным размахом. Это последний большой праздник империи перед войной и революцией. В воздухе уже чувствуется натяжение: забастовки не прекращаются.", cinema: "«Ключи счастья» (реж. Владимир Гардин) — масштабная и скандальная двухсерийная драма. «Ночь перед Рождеством» (реж. Владислав Старевич) — комедия-фэнтези по Гоголю.", analysis: "Индустрия набирает обороты, выходят многосерийные картины." },
    { year: 1914, history: "Начало Первой мировой войны. 1 августа Германия объявляет войну России. В стране поднимается патриотическая волна, но она быстро сменяется тревогой. Мобилизация, закрытие границ, экономические трудности. Часть творческой интеллигенции уходит на фронт.", cinema: "«Анна Каренина» (реж. Владимир Гардин), «Слава — нам, смерть — врагам» (реж. Евгений Бауэр).", analysis: "Резкая смена повестки: от изящных экранизаций к патриотическим лентам. Появляются новые студии." },
    { year: 1915, history: "Великое отступление. Русская армия оставляет Польшу, Литву, часть Белоруссии. В стране нарастает экономический кризис и недовольство властью (создается «Прогрессивный блок» в Думе). Николай II принимает на себя командование армией, что многие считают роковой ошибкой.", cinema: "Снято 370 фильмов, работает 47 кинокомпаний. Вышли: «Николай Ставрогин» (реж. Яков Протазанов), «После смерти» (реж. Евгений Бауэр), «Портрет Дориана Грея» (реж. Всеволод Мейерхольд).", analysis: "Индустрия растет на глазах. Много мистики и экранизаций." },
    { year: 1916, history: "Предреволюционный кризис. Война затягивается, растут потери. В экономике разруха, в городах вводят карточки. Нарастает недовольство монархией, растут слухи об измене (особенно в отношении императрицы Александры и Распутина). До революции остаются считанные месяцы.", cinema: "«Пиковая дама» (реж. Яков Протазанов, в гл. роли Иван Мозжухин). «Жизнь за жизнь» (реж. Евгений Бауэр, с Верой Холодной).", analysis: "Глубокий психологизм, монтажные решения Бауэра опередили время на десятилетие." },
    { year: 1917, history: "Революция. Февральская революция свергает монархию, Николай II отрекается. В октябре большевики берут власть. Страна погружается в хаос Гражданской войны. Кинематограф как индустрия переживает коллапс: студии эвакуируются на юг (в Ялту), многие кинематографисты эмигрируют.", cinema: "«У камина» (реж. Пётр Чардынин) — мелодрама с Верой Холодной, главная коммерческая сенсация года.", analysis: "Зритель устал от реальной жизни и требовал от кино привычных «грёз»." },
    { year: 1918, history: "Гражданская война и террор. Разворачивается полномасштабная война между красными и белыми. В июле расстреляна царская семья в Екатеринбурге. В стране вводится продразверстка, начинается «военный коммунизм». Большевики снимают запреты на показ духовенства и царской семьи, которые были при царе.", cinema: "«Отец Сергий» (реж. Яков Протазанов) — экранизация Толстого. «Барышня и хулиган» (с Маяковским) — Маяковский как актер. «Уплотнение» — агитпропфильм.", analysis: "Итог десятилетней работы над классикой и первые ростки агитационного кино." },
    { year: 1919, history: "Пик Гражданской войны и разруха. В стране голод, эпидемии тифа и «испанки». Экономика полностью разрушена. 27 августа выходит декрет о национализации кинодела (позже эта дата станет Днем российского кино).", cinema: "«Поликушка» (реж. Александр Санин) — главная художественная работа года с актерами МХТ. «Вскрытие мощей Сергия Радонежского» (реж. Дзига Вертов).", analysis: "Ирония декрета: реальных результатов он не дал, республике было не до кино. Начало раскола и эмиграции." },
    { year: 1920, history: "Конец Гражданской войны. Красные побеждают на большей части территории. Но страна в глубоком кризисе: голод, разруха, крестьянские восстания (Антоновщина). Начинается переход к НЭПу.", cinema: "«На красном фронте» (реж. Лев Кулешов) — первый советский приключенческий фильм. «Взятие Зимнего дворца» (реж. Николай Евреинов, Константин Державин).", analysis: "В этом же году Лев Кулешов ставит свои знаменитые эксперименты с монтажом («эффект Кулешова»), которые лягут в основу теории монтажа." },
    { year: 1921, history: "Переход к НЭПу. Голод в Поволжье, унесший миллионы жизней. Кронштадтское восстание матросов, которое жестоко подавлено. В стране идет борьба с голодом и разрухой.", cinema: "«Серп и молот» (реж. Владимир Гардин). «Голод… Голод… Голод…» (реж. Владимир Гардин, Всеволод Пудовкин).", analysis: "Кинопроизводство переживает самую низкую точку — выходит всего 7 художественных фильмов. Но именно сейчас закладывается переход от коротких агиток к полноценным полнометражным картинам." },
    { year: 1922, history: "Образование СССР (30 декабря). Окончание Гражданской войны на Дальнем Востоке. Ленин произносит фразу о кино как «важнейшем из всех искусств». Начинает оживать частный прокат.", cinema: "«Призрак бродит по Европе» (реж. Владимир Гардин). «Скорбь бесконечная» (реж. Александр Пантелеев).", analysis: "Советская власть впервые экранизирует «иностранный» сюжет о крушении монархии. Кинематограф начинает говорить мировыми образами." },
    { year: 1923, history: "НЭП расшевелил экономику. Зритель возвращается в кинотеатры. В стране относительная стабилизация после лет хаоса.", cinema: "«Красные дьяволята» (реж. Иван Перестиани). «Слесарь и канцлер» (реж. Владимир Гардин, при участии Всеволода Пудовкина).", analysis: "Бум авантюрного жанра. «Красные дьяволята» становятся первым советским приключенческим фильмом и главным прокатным хитом года." },
    { year: 1924, history: "Смерть Ленина (январь). Укрепление власти Сталина. Признание СССР ведущими державами. Продолжение НЭПа.", cinema: "«Аэлита» (реж. Яков Протазанов). «Необычайные приключения мистера Веста в стране большевиков» (реж. Лев Кулешов). «Стачка» (реж. Сергей Эйзенштейн). «Кино-глаз» (реж. Дзига Вертов).", analysis: "Год, когда советское кино громко заявило о себе. Выходит первый советский фантастический фильм, а Эйзенштейн и Вертов заявляют о новых путях киноязыка." },
    { year: 1925, history: "Продолжение культурных экспериментов 20-х годов. XIV съезд ВКП(б), курс на индустриализацию.", cinema: "«Броненосец „Потёмкин“» (реж. Сергей Эйзенштейн). «Шахматная горячка» (реж. Всеволод Пудовкин, Николай Шпиковский).", analysis: "Премьера «Броненосца „Потёмкина“» становится мировым событием. За советским кино закрепляется репутация «лаборатории киноязыка»." },
    { year: 1926, history: "Период расцвета авангарда. Индустриализация набирает обороты. В стране идет борьба с «троцкистской оппозицией».", cinema: "«Мать» (реж. Всеволод Пудовкин). «По закону» (реж. Лев Кулешов). «Мисс Менд» (реж. Фёдор Оцеп, Борис Барнет).", analysis: "Советское кино выходит из стадии «лабораторных опытов» и становится разнообразным. Пудовкин создает манифест «пушкинского» монтажа, а Барнет снимает зрелищный приключенческий хит." },
    { year: 1927, history: "Начало первой пятилетки. Индустриализация. 10-летие Октября. Обострение внутрипартийной борьбы (Троцкий, Зиновьев, Каменев исключены из партии).", cinema: "«Октябрь» (реж. Сергей Эйзенштейн). «Конец Санкт-Петербурга» (реж. Всеволод Пудовкин). «Третья Мещанская» (реж. Абрам Роом).", analysis: "Эйзенштейн и Пудовкин создают монументальные историко-революционные эпопеи. А Роом снимает тонкую бытовую драму о «новом быте», которая шокирует зрителя своей откровенностью." },
    { year: 1928, history: "Первый пятилетний план в действии. Начало коллективизации. Шахтинский процесс над «вредителями».", cinema: "«Человек с киноаппаратом» (реж. Дзига Вертов). «Саламандра» (реж. Всеволод Пудовкин).", analysis: "Вертов создает абсолютный манифест документального кино, отказываясь от сценария и актеров. Это манифест «жизни врасплох», который до сих пор изучают во всех киношколах." },
    { year: 1929, history: "«Великий перелом». Начало сплошной коллективизации и раскулачивания. Установление тоталитарного режима.", cinema: "«Обломок империи» (реж. Фридрих Эрмлер). «Старое и новое» (реж. Сергей Эйзенштейн).", analysis: "Конец эпохи великого немого кино. «Обломок империи» становится последним большим немым фильмом, а Эйзенштейн снимает свою картину о коллективизации." },
    { year: 1930, history: "Раскулачивание, голод. Массовые репрессии против «кулаков» и «подкулачников».", cinema: "«Земля» (реж. Александр Довженко).", analysis: "Довженко снимает один из самых красивых и трагических фильмов о земле и смерти. Его поэтический стиль становится образцом для подражания." },
    { year: 1931, history: "Индустриализация страны, запуск первых заводов-гигантов (Магнитка, Днепрогэс). В стране запускается звуковое кино.", cinema: "«Одна» (реж. Григорий Козинцев, Леонид Трауберг). «Земля жаждет» (реж. Юлий Райзман). «Никита Иванов» (реж. Михаил Калатозов).", analysis: "Выходят первые советские звуковые картины. Однако немое кино ещё продолжает жить: многие режиссёры (например, Эйзенштейн и Довженко) работают над проектами, которые долго не доходят до экрана из-за проблем со звуком и цензурой." },
    { year: 1932, history: "Голод 1932-1933 годов. Ужесточение режима. Принятие постановления о перестройке литературно-художественных организаций.", cinema: "«Встречный» (реж. Фридрих Эрмлер, Сергей Юткевич, Лео Арнштам). «Иван» (реж. Александр Довженко). «Возвращение Нейтана Беккера» (реж. Рашель Мильман-Криммер, Борис Шпис).", analysis: "Активно развивается жанр производственной драмы: в центре сюжетов оказываются стройки первой пятилетки, трудовой подвиг и «перековка» человека." },
    { year: 1933, history: "Голод. Укрепление тоталитарной системы. В феврале образовано Главное управление кинофотопромышленности (ГУКФ) при СНК СССР.", cinema: "«Окраина» (реж. Борис Барнет). «Великий утешитель» (реж. Лев Кулешов).", analysis: "«Великий утешитель» часто называют последним выдающимся фильмом Льва Кулешова. Это размышление о судьбе художника в несвободном обществе." },
    { year: 1934, history: "I съезд советских писателей, утверждение метода социалистического реализма. Убийство Кирова, начало Большого террора.", cinema: "«Чапаев» (реж. братья Васильевы). «Весёлые ребята» (реж. Григорий Александров). «Юность Максима» (реж. Григорий Козинцев, Леонид Трауберг).", analysis: "«Чапаев» быстро становится народной картиной: в первый год проката её посмотрели более 30 миллионов человек. Позже фильм получил признание и за рубежом. Начало эпохи «большого стиля»." },
    { year: 1935, history: "Открытие первой линии метро в Москве. Усиление репрессий. «Стахановское движение».", cinema: "«Космический рейс» (реж. Василий Журавлёв). «Строгий юноша» (реж. Абрам Роом).", analysis: "Формальная смелость «Строгого юноши» стала причиной проблем: в 1936 году картину запретили, сочтя её слишком эстетской и оторванной от задач социалистического реализма. Фильм оставался «на полке» до середины 1960-х годов." },
    { year: 1936, history: "Принятие «сталинской» Конституции. Открытые политические процессы (дело Зиновьева и Каменева).", cinema: "«Груня Корнакова» («Соловей-соловушко», реж. Николай Экк). «Цирк» (реж. Григорий Александров). «Дети капитана Гранта» (реж. Владимир Вайншток).", analysis: "«Груня Корнакова» становится первым в СССР цветным художественным фильмом (снятым по технологии «бипак»). Правда, в широком прокате полностью цветными были не все копии — часть напечатали в чёрно-белом варианте. А «Дети капитана Гранта» имели огромный успех: после премьеры зрители массово писали создателям письма." },
    { year: 1937, history: "«Большой террор». Массовые репрессии, расстрелы. В марте Политбюро запретило постановку фильма Сергея Эйзенштейна «Бежин луг».", cinema: "«Ленин в Октябре» (реж. Михаил Ромм). «Возвращение Максима» (реж. Григорий Козинцев, Леонид Трауберг). «Пётр Первый» (реж. Владимир Петров). «Богатая невеста» (реж. Иван Пырьев).", analysis: "Идеологический контроль усилился. Осенью 1937 года началась кампания против начальника Главного управления кинематографии Б. З. Шумяцкого. Его обвиняли во «вредительстве», и это напрямую влияло на кинопроцесс. В индустрии царила тревожная атмосфера, но при этом выходили и комедии, демонстрировавшие, что «жить стало лучше, жить стало веселее»." },
    { year: 1938, history: "Продолжение репрессий. Пакт Молотова-Риббентропа еще впереди, но напряжение в Европе растет. Кино выделилось в самостоятельную отрасль: при СНК СССР создали Комитет по делам кинематографии.", cinema: "«Александр Невский» (реж. Сергей Эйзенштейн, при участии Дмитрия Васильева). «Волга-Волга» (реж. Григорий Александров). «Доктор Айболит» (реж. Владимир Немоляев). «По щучьему веленью» (реж. Александр Роу).", analysis: "На смену репрессированному Борису Шумяцкому пришёл Семён Дукельский. Фильм «Александр Невский» задумывался как антифашистский и позже, с началом Великой Отечественной войны, зазвучал по-новому. Продолжали развиваться разные направления — от исторической драмы до детского кино." },
    { year: 1939, history: "Начало Второй мировой войны. Пакт Молотова-Риббентропа. Советско-финская война. В фильмах отчётливо звучит оборонная и патриотическая тема.", cinema: "«Трактористы» (реж. Иван Пырьев). «Щорс» (реж. Александр Довженко). «Василиса Прекрасная» (реж. Александр Роу). «Член правительства» (реж. Иосиф Хейфиц, Александр Зархи). «Ошибка инженера Кочина» (реж. Александр Мачерет).", analysis: "Сочетание «образцового» соцреализма, масштабных исторических полотен и лёгких комедий, при этом всё жестко вписано в идеологические рамки и подчинено задачам времени." },
    { year: 1940, history: "Присоединение Прибалтики, Бессарабии. Нарастание международной напряженности. В кино всё чаще появляются сюжеты, связанные с готовностью к защите страны.", cinema: "«Суворов» (реж. Всеволод Пудовкин, Михаил Доллер). «Светлый путь» (реж. Григорий Александров). «Тимур и его команда» (реж. Александр Разумный).", analysis: "Даже в лёгких жанрах прочитывались задачи времени: воспевание трудового подвига и воспитание патриотизма и коллективизма у детей." },
    { year: 1941, history: "22 июня — начало Великой Отечественной войны. Резкий перелом из «мирного» кино в военное. «Мосфильм» и «Ленфильм» частично вывезли в Алма-Ату, где создали ЦОКС. Многие кинематографисты уходили на фронт.", cinema: "«Свинарка и пастух» (реж. Иван Пырьев). «Сердца четырёх» (реж. Константин Юдин). «Антон Иванович сердится» (реж. Александр Ивановский). «Валерий Чкалов» (реж. Михаил Калатозов).", analysis: "«Свинарка и пастух» снималась ещё до войны. В условиях войны лёгкая история про «трудовые достижения» стала не просто развлечением, а способом поддержать людей в тылу и на фронте. А «Сердца четырёх» закончили к лету 1941-го, но в прокат выпустили только в 1945 году, посчитав, что в тяжёлое время такая «лёгкость» неуместна." },
    { year: 1942, history: "Битва за Сталинград, тяжелейший период войны. Съёмки шли в эвакуации (Алма-Ата, Ашхабад, Ташкент), сроки были сжатыми.", cinema: "«Секретарь райкома» (реж. Иван Пырьев). «Парень из нашего города» (реж. Александр Столпер, Борис Иванов). «Антоша Рыбкин» (реж. Константин Юдин).", analysis: "Фильм «Парень из нашего города» говорил не лозунгами, а человеческим языком о войне и ожидании. Юмор в «Антоше Рыбкине» — это не про развлечения, а про стойкость и смекалку." },
    { year: 1943, history: "Переломные события войны (Сталинград, Курск). Тегеранская конференция. Съёмки по-прежнему шли в эвакуации, но интонация картин стала чуть глубже: меньше агитации, больше психологизма.", cinema: "«Два бойца» (реж. Леонид Луков). «Она защищает Родину» (реж. Фридрих Эрмлер). «Кутузов» (реж. Владимир Петров). «Воздушный извозчик» (реж. Герберт Раппапорт).", analysis: "Кино стало частью общего дела: оно должно было вдохновлять, напоминать о цене победы и показывать, что даже в самые тяжёлые дни есть место человеческому, личному, настоящему. Картины работали как эмоциональный якорь." },
    { year: 1944, history: "Освобождение территории СССР, открытие Второго фронта. Конец блокады Ленинграда.", cinema: "«В 6 часов вечера после войны» (реж. Иван Пырьев). «Иван Грозный» (1-я серия, реж. Сергей Эйзенштейн).", analysis: "Кино начинает мечтать о мирной жизни, но все еще находится в контексте войны. Лирическая комедия Пырьева становится гимном надежды." },
    { year: 1945, history: "Победа в Великой Отечественной войне. Окончание Второй мировой войны. Разруха, восстановление экономики.", cinema: "«Без вины виноватые» (реж. Владимир Петров). «Здравствуй, Москва!» (реж. Сергей Юткевич). Выходит отложенная комедия «Сердца четырёх».", analysis: "Кино возвращается к мирной жизни, но тема войны еще долго будет главной." },
    { year: 1946, history: "Начало «холодной войны». Восстановление экономики. Идеологический террор (постановление ЦК о журналах «Звезда» и «Ленинград»).", cinema: "«Иван Грозный» (2-я серия, реж. Сергей Эйзенштейн). «Клятва» (реж. Михаил Чиаурели).", analysis: "Ужесточение идеологического контроля. Вторая серия «Ивана Грозного» ляжет на полку." },
    { year: 1947, history: "Денежная реформа, отмена карточек. Начало «холодной войны» в разгаре.", cinema: "«Подвиг разведчика» (реж. Борис Барнет). «Золушка» (реж. Надежда Кошеверова, Михаил Шапиро).", analysis: "«Золушка» становится классикой, уводя зрителя в сказку от суровой реальности. Фильм до сих пор любим миллионами." },
    { year: 1948, history: "«Ленинградское дело». Усиление репрессий. Начало борьбы с «формализмом» в искусстве.", cinema: "«Молодая гвардия» (реж. Сергей Герасимов). «Три встречи» (реж. Александр Птушко).", analysis: "Появляются фильмы о героическом подвиге, но под жестким идеологическим контролем." },
    { year: 1949, history: "Создание СЭВ. Испытание первой советской атомной бомбы. Начало гонки вооружений.", cinema: "«Встреча на Эльбе» (реж. Григорий Александров). «Кубанские казаки» (реж. Иван Пырьев).", analysis: "«Кубанские казаки» — яркий пример «парадного» кино, показывающего изобилие и счастье в деревне, в то время как в реальности страна жила в послевоенной разрухе." },
    { year: 1950, history: "Корейская война. Начало борьбы с «космополитизмом».", cinema: "«Секретная миссия» (реж. Михаил Ромм). «Смелые люди» (реж. Константин Юдин).", analysis: "Шпионские драмы и фильмы о смелости, которые отвечали духу времени и нарастающей холодной войне." },
    { year: 1951, history: "Послевоенное восстановление экономики. В стране идет борьба с «космополитизмом» и «низкопоклонством перед Западом». Ужесточается идеологический контроль в науке и культуре.", cinema: "«Тарас Шевченко» (реж. Игорь Савченко). «Сельский врач» (реж. Сергей Герасимов).", analysis: "Выходят биографические фильмы и картины на производственную тему, которые должны были воспитывать зрителя в духе преданности делу." },
    { year: 1952, history: "XIX съезд КПСС. Переименование партии из ВКП(б) в КПСС. Последние годы сталинского правления.", cinema: "«Композитор Глинка» (реж. Григорий Александров). «Ревизор» (реж. Владимир Петров).", analysis: "Экранизации классики и биографические драмы остаются главными жанрами. Кино работает как иллюстрация к официальной идеологии." },
    { year: 1953, history: "Смерть Сталина (5 марта). Амнистия, начало «оттепели». Арест Берии. В обществе появляется робкая надежда на перемены.", cinema: "«Великий воин Албании Скандербег» (реж. Сергей Юткевич).", analysis: "Завершается эпоха «малокартинья» (когда снимали очень мало фильмов). Кинематограф замирает в ожидании перемен." },
    { year: 1954, history: "Начало освоения целины. Передача Крыма Украинской ССР. Хрущев набирает силу.", cinema: "«Большая семья» (реж. Иосиф Хейфиц).", analysis: "Этот фильм приоткрыл дверь «оттепели». Кино возвращается к человеку и его простым, земным проблемам, а не только к производственным подвигам." },
    { year: 1955, history: "Подписание Варшавского договора. Начало развенчания культа личности. Относительная либерализация внутренней политики.", cinema: "«Весенние голоса» (реж. Сергей Герасимов). «Максим Перепелица» (реж. Анатолий Граник).", analysis: "Появляются легкие, жизнерадостные комедии. Зритель устал от серьезности и хочет улыбаться." },
    { year: 1956, history: "XX съезд КПСС. Хрущев зачитывает секретный доклад о культе личности Сталина. Начинается «оттепель». Венгерский кризис.", cinema: "«Карнавальная ночь» (реж. Эльдар Рязанов). «Летят журавли» (реж. Михаил Калатозов).", analysis: "«Карнавальная ночь» становится символом «оттепели», а «Летят журавли» получает «Золотую пальмовую ветвь» в Каннах. Кино учится говорить о травме войны и радости мирной жизни одновременно." },
    { year: 1957, history: "Запуск первого искусственного спутника Земли. Всемирный фестиваль молодежи и студентов в Москве. Начало космической эры.", cinema: "«Высота» (реж. Александр Зархи). «Дом, в котором я живу» (реж. Лев Кулиджанов).", analysis: "«Высота» становится гимном индустриализации и романтике труда. В воздухе витает ощущение, что страна может всё." },
    { year: 1958, history: "Присуждение Нобелевской премии Борису Пастернаку за роман «Доктор Живаго» и последовавшая травля писателя. Запуск спутника-разведчика.", cinema: "«Идиот» (реж. Иван Пырьев). «Судьба человека» (реж. Сергей Бондарчук).", analysis: "«Судьба человека» становится мощным дебютом Бондарчука. Появляется масштабное, но при этом искреннее кино о войне, где в центре — судьба простого человека." },
    { year: 1959, history: "Запуск первых аппаратов к Луне. Усиление «оттепели». Визит Хрущева в США.", cinema: "«Судьба человека» (реж. Сергей Бондарчук). «Баллада о солдате» (реж. Григорий Чухрай).", analysis: "Кино про войну с точки зрения простого человека — это новая волна. «Баллада о солдате» трогает до слез своей простотой и правдой." },
    { year: 1960, history: "Отмена налогов с рабочих. Испытание водородной бомбы. Начало разногласий с Китаем.", cinema: "«Весна на Заречной улице» (реж. Марлен Хуциев, Феликс Миронер). «Дама с собачкой» (реж. Иосиф Хейфиц).", photo: "https://images-s.kinorium.com/movie/cover/47110/w1500_51492322.jpg", analysis: "Лирические фильмы о простых людях находят отклик у зрителя. Кино становится более камерным и человечным." },
    { year: 1961, history: "Полет Юрия Гагарина (12 апреля). XXII съезд КПСС (вынос тела Сталина из Мавзолея). Берлинская стена.", cinema: "«Чистое небо» (реж. Григорий Чухрай). «Иваново детство» (реж. Андрей Тарковский).", analysis: "«Чистое небо» — о судьбе летчика, вернувшегося из плена. «Иваново детство» получает «Золотого льва» в Венеции. Тарковский заявляет о себе как о гении." },
    { year: 1962, history: "Карибский кризис (мир на грани ядерной войны). Расстрел рабочих в Новочеркасске.", cinema: "«Иваново детство» (реж. Андрей Тарковский). «Гусарская баллада» (реж. Эльдар Рязанов).", analysis: "Появляется кино, которое можно назвать «поэтическим». Рязанов находит свой жанр — музыкальную комедию с глубоким смыслом." },
    { year: 1963, history: "Подписание договора о запрещении испытаний ядерного оружия в трех средах. Смягчение цензуры.", cinema: "«Я шагаю по Москве» (реж. Георгий Данелия). «Оптимистическая трагедия» (реж. Самсон Самсонов).", analysis: "«Я шагаю по Москве» становится гимном оттепели и свободы. Фильм дышит легкостью и надеждой." },
    { year: 1964, history: "Отставка Хрущева. Приход к власти Брежнева. Начало «застоя».", cinema: "«Я шагаю по Москве» (реж. Георгий Данелия). «Председатель» (реж. Алексей Салтыков).", analysis: "Оттепель заканчивается, но ее дыхание еще живо в кино. «Председатель» — жесткая драма о послевоенной деревне, которая звучит уже по-новому." },
    { year: 1965, history: "Начало космической программы «Союз». Экономическая реформа Косыгина. Ужесточение идеологического контроля.", cinema: "«Обыкновенный фашизм» (реж. Михаил Ромм). «Иду на грозу» (реж. Сергей Микаэлян).", photo: "https://images-s.kinorium.com/movie/poster/55901/w1500_3043725.jpg", analysis: "Ромм создает мощный документальный фильм-предупреждение. «Иду на грозу» — о физиках-шестидесятниках и их мечтах." },
    { year: 1966, history: "Запуск «Луны-9», мягкая посадка на Луну. Судебный процесс над писателями Синявским и Даниэлем.", cinema: "«Андрей Рублев» (реж. Андрей Тарковский). «Берегись автомобиля» (реж. Эльдар Рязанов).", photo: "https://images-s.kinorium.com/movie/fanart/56395/w1500_49909839.jpg", analysis: "«Андрей Рублев» ложится на полку, но становится легендой. «Берегись автомобиля» — всенародно любимая комедия, которая разошлась на цитаты." },
    { year: 1967, history: "50-летие Октябрьской революции. Ввод войск в Чехословакию (начинается «Пражская весна»).", cinema: "«Комиссар» (реж. Александр Аскольдов). «Кавказская пленница, или Новые приключения Шурика» (реж. Леонид Гайдай).", photo: "https://images-s.kinorium.com/movie/poster/56811/w1500_57359096.jpg", analysis: "«Комиссар» запрещают на 20 лет. А «Кавказская пленница» становится народным хитом. Кино разделяется на «официальное» и «народное»." },
    { year: 1968, history: "Ввод советских войск в Чехословакию. Конец «Пражской весны». Усиление диссидентского движения.", cinema: "«Бриллиантовая рука» (реж. Леонид Гайдай). «Живой труп» (реж. Владимир Венгеров).", photo: "https://images-s.kinorium.com/movie/poster/58719/w1500_55996652.jpg", analysis: "В реальности — танки в Праге, в кино — Семен Семенович и «шеф, всё пропало». Люди уходили от ужаса реальности в смех. «Бриллиантовая рука» собирает рекордную кассу." },
    { year: 1969, history: "Первый человек на Луне (Нил Армстронг). Пограничный конфликт на острове Даманский. Начало разрядки.", cinema: "«Освобождение» (реж. Юрий Озеров). «Красная палатка» (реж. Михаил Калатозов).", analysis: "«Освобождение» — масштабная киноэпопея о войне. «Красная палатка» — совместный проект с Италией, попытка выйти на мировой рынок." },
    { year: 1970, history: "100-летие со дня рождения Ленина. Смещение Косыгина, начало «застоя» в экономике.", cinema: "«Белое солнце пустыни» (реж. Владимир Мотыль). «Любовь и голуби» (реж. Владимир Меньшов, позже).", analysis: "«Белое солнце пустыни» становится культовым фильмом. Это вестерн по-советски, который до сих пор смотрят каждый год." },
    { year: 1971, history: "XXIV съезд КПСС. Отставка Хрущева (смерть в 1971). Начало борьбы с «инакомыслием».", cinema: "«Офицеры» (реж. Владимир Роговой). «Джентльмены удачи» (реж. Александр Серый).", analysis: "«Офицеры» — фильм о преемственности поколений. «Джентльмены удачи» — комедия, которая мгновенно расходится на цитаты." },
    { year: 1972, history: "Подписание договора ОСВ-1. Арест диссидентов. Ужесточение цензуры.", cinema: "«А зори здесь тихие» (реж. Станислав Ростоцкий). «Солярис» (реж. Андрей Тарковский).", analysis: "«А зори здесь тихие» — пронзительная история о женщинах на войне. «Солярис» — философская фантастика, которую признают во всем мире." },
    { year: 1973, history: "Война Судного дня на Ближнем Востоке. Нефтяной кризис. Усиление разрядки.", cinema: "«Иван Васильевич меняет профессию» (реж. Леонид Гайдай). «Калина красная» (реж. Василий Шукшин).", analysis: "«Иван Васильевич» — всенародный хит. «Калина красная» — последняя работа Шукшина, трагическая история о возвращении из тюрьмы." },
    { year: 1974, history: "Высылка Александра Солженицына из СССР. Начало «разрядки» на Западе. БАМ.", cinema: "«В бой идут одни „старики“» (реж. Леонид Быков). «Калина красная» (реж. Василий Шукшин).", analysis: "«В бой идут одни „старики“» — фильм о летчиках, который становится народным. «Калина красная» получает признание, но Шукшина уже нет." },
    { year: 1975, history: "Совместный полет «Союз-Аполлон». Хельсинкские соглашения. Начало застоя.", cinema: "«Они сражались за Родину» (реж. Сергей Бондарчук). «Ирония судьбы, или С легким паром!» (реж. Эльдар Рязанов).", analysis: "«Они сражались за Родину» — последняя роль Шукшина. «Ирония судьбы» становится новогодним ритуалом для всей страны." },
    { year: 1976, history: "Смерть Мао Цзэдуна. Начало «разрядки» в Европе. Брежнев на пике власти.", cinema: "«Восхождение» (реж. Лариса Шепитько). «Тимур и его команда» (реж. Александр Бланк).", analysis: "«Восхождение» — мощная философская драма о выборе и предательстве. Фильм получает «Золотого медведя» в Берлине." },
    { year: 1977, history: "Принятие новой Конституции СССР. Начало войны в Афганистане (конец года). Диссидентское движение.", cinema: "«Служебный роман» (реж. Эльдар Рязанов). «Белый Бим Черное ухо» (реж. Станислав Ростоцкий).", analysis: "«Служебный роман» — лирическая комедия, которая становится хитом. «Белый Бим» — пронзительная история о собаке, которую любят все." },
    { year: 1978, history: "Начало афганской войны. Ужесточение идеологического контроля. Экономический застой.", cinema: "«Место встречи изменить нельзя» (реж. Станислав Говорухин). «Мимино» (реж. Георгий Данелия).", analysis: "«Место встречи» — культовый сериал о послевоенной Москве. «Мимино» — добрая комедия о грузинском летчике, которая становится всенародной." },
    { year: 1979, history: "Ввод советских войск в Афганистан (декабрь). Начало конца «разрядки». Олимпиада-80 впереди.", cinema: "«Москва слезам не верит» (реж. Владимир Меньшов). «Сталкер» (реж. Андрей Тарковский).", analysis: "«Москва слезам не верит» получает «Оскар» и становится символом эпохи. «Сталкер» — философская притча о зоне и желаниях." },
    { year: 1980, history: "Олимпиада-80 в Москве. Смерть Высоцкого. Начало политического кризиса в Польше («Солидарность»).", cinema: "«Москва слезам не верит» (реж. Владимир Меньшов). «Экипаж» (реж. Александр Митта).", analysis: "«Экипаж» — фильм-катастрофа, который собирает рекордную кассу. Кино осваивает новые жанры." },
    { year: 1981, history: "XXVI съезд КПСС. Введение войск в Польшу (военное положение). Начало «второго застоя».", cinema: "«Тегеран-43» (реж. Александр Алов, Владимир Наумов). «Родня» (реж. Никита Михалков).", analysis: "«Тегеран-43» — политический детектив с международным составом. «Родня» — трагикомедия о семье." },
    { year: 1982, history: "Смерть Брежнева (ноябрь). Приход Андропова. Попытка реформ и борьба с коррупцией.", cinema: "«Покровские ворота» (реж. Михаил Козаков). «Вокзал для двоих» (реж. Эльдар Рязанов).", photo: "https://www.abcfact.ru/upload/001/u107/193/5934a1cf.jpg", analysis: "«Покровские ворота» — ностальгическая комедия о 50-х. «Вокзал для двоих» — лирическая драма о любви на вокзале." },
    { year: 1983, history: "Южнокорейский Boeing сбит над Сахалином. Обострение холодной войны. Андропов у власти.", cinema: "«Ностальгия» (реж. Андрей Тарковский). «Жестокий романс» (реж. Эльдар Рязанов).", analysis: "«Ностальгия» снимается в Италии и получает приз в Каннах. «Жестокий романс» — экранизация Островского, которая становится хитом." },
    { year: 1984, history: "Смерть Андропова. Приход Черненко. Последний «застойный» год. Бойкот Олимпиады в Лос-Анджелесе.", cinema: "«Покаяние» (реж. Тенгиз Абуладзе). «Курьер» (реж. Карен Шахназаров).", photo: "https://images-s.kinorium.com/movie/poster/83025/w1500_52964964.jpg", analysis: "«Покаяние» ложится на полку до 1987 года. «Курьер» — фильм о циничном подростке, который не хочет жить по правилам взрослых." },
    { year: 1985, history: "Приход Горбачева. Начало «перестройки». Антиалкогольная кампания. Ускорение.", cinema: "«Иди и смотри» (реж. Элем Климов). «Самая обаятельная и привлекательная» (реж. Геральд Бежанов).", photo: "https://images-s.kinorium.com/movie/poster/82658/w1500_51757917.jpg", analysis: "«Иди и смотри» — самый страшный фильм о войне, который потрясает мир. «Самая обаятельная» — легкая комедия, которая становится хитом." },
    { year: 1986, history: "Авария на Чернобыльской АЭС (апрель). Начало гласности. Возвращение Сахарова из ссылки.", cinema: "«Курьер» (реж. Карен Шахназаров). «Хорошо сидим!» (реж. Мунид Закиров).", photo: "https://images-s.kinorium.com/movie/poster/83880/w1500_52628891.jpg", analysis: "«Курьер» становится голосом поколения. Кино говорит о проблемах молодежи открыто." },
    { year: 1987, history: "Подписание договора о РСМД (ракеты средней и меньшей дальности). Начало политики «нового мышления». Выход «Покаяния».", cinema: "«Покаяние» (реж. Тенгиз Абуладзе). «Асса» (реж. Сергей Соловьев).", photo: "https://images-s.kinorium.com/movie/poster/86009/w1500_3190081.jpg", analysis: "«Покаяние» наконец выходит на экраны и становится событием. «Асса» — культовый фильм о поколении, которое хочет свободы." },
    { year: 1988, history: "XIX партконференция. Начало распада СССР. Карабахский конфликт. Закон о кооперации.", cinema: "«Маленькая Вера» (реж. Василий Пичул). «Интердевочка» (реж. Петр Тодоровский).", photo: "https://images-s.kinorium.com/movie/poster/87591/w1500_52983490.jpg", analysis: "«Маленькая Вера» — первый фильм, где открыто показана сексуальная сцена. «Интердевочка» — о советских женщинах, которые выходят замуж за иностранцев." },
    { year: 1989, history: "Падение Берлинской стены. Вывод войск из Афганистана. Начало распада соцлагеря. I Съезд народных депутатов.", cinema: "«Холодное лето пятьдесят третьего…» (реж. Александр Прошкин). «Криминальный талант» (реж. Сергей Ашкенази).", photo: "https://images-s.kinorium.com/movie/poster/87472/w1500_3191756.jpg", analysis: "«Холодное лето» — о послесталинской амнистии. Кино обращается к запретным темам." },
    { year: 1990, history: "Отмена 6-й статьи Конституции о руководящей роли КПСС. Горбачев — президент СССР. Начало парада суверенитетов.", cinema: "«Такси-блюз» (реж. Павел Лунгин). «Паспорт» (реж. Георгий Данелия).", photo: "https://images.kinorium.com/movie/cover/92112/w1500_47490571.jpg", analysis: "«Такси-блюз» получает приз за режиссуру в Каннах. Кино становится жестче и реалистичнее." },
    { year: 1991, history: "Августовский путч. Распад СССР (декабрь). Конец советской эпохи. Экономический кризис.", cinema: "«Небеса обетованные» (реж. Эльдар Рязанов). «Цареубийца» (реж. Карен Шахназаров).", photo: "https://images.kinorium.com/movie/poster/93638/w1500_50246396.jpg", analysis: "Кино фиксирует распад привычного уклада. «Небеса обетованные» — горькая трагикомедия о бездомных. «Цареубийца» — попытка осмыслить травму революции." },
    { year: 1992, history: "«Шоковая терапия» Гайдара. Гиперинфляция. Ваучерная приватизация. Криминальные войны.", cinema: "«Белые одежды» (реж. Станислав Говорухин). «Анкор, еще анкор!» (реж. Петр Тодоровский).", photo: "https://images.kinorium.com/movie/poster/92371/w1500_54757131.jpg", analysis: "Кино осваивает новую реальность. «Белые одежды» — о генетиках и репрессиях. «Анкор» — о послевоенной жизни." },
    { year: 1993, history: "Конституционный кризис. Расстрел Белого дома (октябрь). Принятие новой Конституции. Дефолт.", cinema: "«Сны» (реж. Карен Шахназаров). «Мафия бессмертна» (реж. Леонид Партигул).", photo: "https://images.kinorium.com/movie/poster/98573/w1500_51719805.jpg", analysis: "«Сны» — сюрреалистическая комедия о России 90-х. Кино пытается осмыслить хаос." },
    { year: 1994, history: "Начало Первой Чеченской войны (декабрь). Дефолт. Кризис неплатежей. Приватизация.", cinema: "«Утомленные солнцем» (реж. Никита Михалков). «Лимита» (реж. Денис Евстигнеев).", photo: "https://images.kinorium.com/movie/poster/101580/w1500_51643586.jpg", analysis: "«Утомленные солнцем» получает «Оскар». Кино обращается к сталинской эпохе." },
    { year: 1995, history: "Война в Чечне продолжается. Буденновск (теракт). Парламентские выборы. Кризис.", cinema: "«Мусульманин» (реж. Владимир Хотиненко). «Особенности национальной охоты» (реж. Александр Рогожкин).", analysis: "«Особенности национальной охоты» — комедия, которая становится всенародным хитом. «Мусульманин» — о войне и вере." },
    { year: 1996, history: "Первая Чеченская война (продолжение). Выборы президента (Ельцин vs Зюганов). Кризис.", cinema: "«Кавказский пленник» (реж. Сергей Бодров-старший). «Дети Арбата» (реж. Андрей Эшпай).", photo: "https://forum.guns.ru/forums/icons/forum_pictures/007470/7470300.jpg", analysis: "«Кавказский пленник» получает приз в Каннах. Кино говорит о войне честно." },
    { year: 1997, history: "Дефолт (август). Кризис. Начало экономического роста. Болезнь Ельцина.", cinema: "«Брат» (реж. Алексей Балабанов). «Вор» (реж. Павел Чухрай).", photo: "https://images.meme-arsenal.com/b910c740811197d9f23486af9956218c.jpg", analysis: "«Брат» становится голосом поколения. «Вор» получает «Оскар» и номинацию. Кино 90-х находит своего героя." },
    { year: 1998, history: "Дефолт (август). Кризис. Смена правительства (Кириенко, Примаков). Начало второй Чеченской войны (август 1999).", cinema: "«Хрусталев, машину!» (реж. Алексей Герман). «Блокпост» (реж. Александр Рогожкин).", photo: "https://f.otzyv.ru/f/kino/1998/5951/poster_5951.jpg", analysis: "«Хрусталев» — сюрреалистическая драма о последних днях Сталина. «Блокпост» — о войне на Кавказе." },
    { year: 1999, history: "Вторая Чеченская война (август). Взрывы домов в Москве. Смена премьеров (Степашин, Путин). Ельцин уходит в отставку (31 декабря).", cinema: "«Зеленый слоник» (реж. Светлана Баскова). «Брат-2» (реж. Алексей Балабанов).", photo: "https://images.meme-arsenal.com/51c4e05a1072a87338ea818ab744c38f.jpg", analysis: "«Зеленый слоник» снимается на любительскую камеру и становится культовым феноменом именно благодаря сети, минуя прокат. «Брат-2» — продолжение истории Данилы Багрова, которое собирает огромную кассу и становится символом эпохи." },
    { year: 2000, history: "Владимир Путин избран президентом (март). Вторая Чеченская война продолжается. Начало экономической стабилизации. Гибель «Курска» (август).", cinema: "«Русский бунт» (реж. Александр Прошкин). «Дневник его жены» (реж. Алексей Учитель).", analysis: "Кино входит в новую эпоху. «Русский бунт» — экранизация Пушкина. «Дневник его жены» — о Бунине и его любви." }
  ];

  const slider = document.getElementById('year-slider');
  const yearDisplay = document.getElementById('current-year-display');
  const labelStart = document.getElementById('label-start');
  const labelEnd = document.getElementById('label-end');
  const historyContent = document.getElementById('history-content');
  const cinemaContent = document.getElementById('cinema-content');
  
  function initSlider() {
    slider.min = 0;
    slider.max = moviesData.length - 1;
    slider.value = 0;
    
    labelStart.textContent = moviesData[0].year;
    labelEnd.textContent = moviesData[moviesData.length - 1].year;
    
    updateView(0);
  }

  function updateView(index) {
    const data = moviesData[index];
    yearDisplay.textContent = data.year;
    
    historyContent.innerHTML = `<p>${data.history}</p>`;
    
    let photoHTML = "";
    if (data.photo && data.photo.trim() !== "") {
      photoHTML = `
        <div class="movie-photo-container">
          <img src="${data.photo}" class="movie-photo" onerror="this.style.display='none'; this.parentElement.style.display='none';">
        </div>
      `;
    }

    cinemaContent.innerHTML = `
      <div class="movie-block">
        ${photoHTML}
        <div class="cinema-text-wrap">
          <div class="cinema-text">${data.cinema}</div>
          <div class="analysis-box">${data.analysis}</div>
        </div>
      </div>
    `;
    
    historyContent.scrollTop = 0;
    cinemaContent.scrollTop = 0;
  }

  slider.addEventListener('input', (e) => {
    const index = parseInt(e.target.value);
    updateView(index);
  });

  initSlider();
</script>
